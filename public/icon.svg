<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E88F5"/>
      <stop offset="1" stop-color="#0D2540"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#FFB74D"/>
      <stop offset="1" stop-color="#F57C00"/>
    </linearGradient>
  </defs>

  <!-- Háttér: brand-kék, iOS-standard kerekített sarok elhagyva (az OS maga vágja le) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Cigaretta (vízszintesen fekve) -->
  <g transform="translate(0, -14)">
    <!-- Cigaretta test -->
    <rect x="88" y="240" width="336" height="66" rx="10" fill="url(#pill)" stroke="rgba(0,0,0,0.15)" stroke-width="2"/>
    <!-- Elválasztó vonal papír/filter között -->
    <line x1="296" y1="240" x2="296" y2="306" stroke="rgba(0,0,0,0.28)" stroke-width="2"/>
    <!-- Parázs csúcs -->
    <rect x="80" y="252" width="14" height="42" rx="2" fill="#FF3D00"/>
    <rect x="72" y="260" width="12" height="26" rx="2" fill="#FFC107"/>
    <!-- Füst-hullámok -->
    <path d="M78 220 Q 68 200 84 184 Q 100 168 88 148" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
    <path d="M120 220 Q 110 202 124 186 Q 138 170 128 152" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- Alsó felirat -->
  <text x="256" y="420" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="66" letter-spacing="6">TRAFIK</text>
  <text x="256" y="466" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="26" letter-spacing="4">HUNOR-COOP</text>
</svg>
